<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174733" />
    <title>Pokémon Paint - Pokédex para colorear</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="home-view">
        <header class="home-header">
          <div class="home-marca">
            <span class="marca-icono" aria-hidden="true"
              ><i></i><i></i><i></i
            ></span>
            <span>Pokémon Paint</span>
          </div>
          <div class="home-heading">
            <span class="home-eyebrow">TU POKÉDEX PARA COLOREAR</span>
            <h1>Elige tu próximo Pokémon</h1>
            <p>Una colección de sprites, un color cada vez.</p>
          </div>
          <button type="button" id="btnAleatorioHome" class="home-random">
            Sorpréndeme
          </button>
        </header>

        <section class="pokedex-section" aria-label="Pokémon disponibles">
          <div class="pokedex-toolbar">
            <div>
              <h2>Pokédex</h2>
              <p id="resumenPagina">Cargando colección...</p>
            </div>
            <div class="pokedex-page-label" id="paginaEtiqueta">Página 1</div>
          </div>
          <div id="pokemonGrid" class="pokemon-grid" aria-live="polite"></div>
          <p id="errorHome" class="home-error" role="alert" hidden></p>
          <nav class="paginacion" aria-label="Paginación de Pokémon">
            <button
              type="button"
              id="btnPaginaAnterior"
              aria-label="Página anterior"
              disabled
            >
              ←
            </button>
            <span id="paginaActual">1</span>
            <button
              type="button"
              id="btnPaginaSiguiente"
              aria-label="Página siguiente"
            >
              →
            </button>
          </nav>
        </section>
      </main>
    </div>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
