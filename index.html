<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#252941" />
    <meta
      name="description"
      content="Explora la Pokédex y colorea Pokémon píxel a píxel. Guarda tu progreso y completa colecciones a tu ritmo."
    />
    <title>PintaDex | Pokédex para colorear</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="icons/icon-192.png"
      sizes="192x192"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="home-view">
        <header class="home-header">
          <div class="home-marca">
            <img class="marca-icono" src="favicon.svg" alt="" />
            <span>PintaDex</span>
          </div>
          <label class="pokemon-search">
            <span class="visually-hidden">Buscar Pokémon</span>
            <input
              id="pokemonSearch"
              type="search"
              placeholder="Nombre o número"
              autocomplete="off"
              aria-label="Buscar Pokémon por nombre o número"
              aria-controls="pokemonGrid"
            />
          </label>
          <button
            type="button"
            id="btnPantallaCompleta"
            class="btn-pantalla-home"
            aria-label="Ver en pantalla completa"
            title="Ver en pantalla completa"
            aria-pressed="false"
          >
            <span aria-hidden="true">⤢</span>
          </button>
        </header>

        <nav class="home-tabs" role="tablist" aria-label="Vistas de la Pokédex">
          <button
            class="home-tab"
            id="tab-progreso"
            type="button"
            role="tab"
            aria-controls="panel-pokedex"
            aria-selected="false"
            tabindex="-1"
            data-vista="a-medias"
          >
            <span>En curso</span>
            <span id="progresoCantidad" class="home-tab-count">0</span>
          </button>
          <button
            class="home-tab"
            id="tab-regiones"
            type="button"
            role="tab"
            aria-controls="panel-pokedex"
            aria-selected="true"
            tabindex="0"
            data-vista="regiones"
          >
            Regiones
          </button>
          <button
            class="home-tab"
            id="tab-colecciones"
            type="button"
            role="tab"
            aria-controls="panel-pokedex"
            aria-selected="false"
            tabindex="-1"
            data-vista="colecciones"
          >
            Colecciones
          </button>
          <button
            class="home-tab"
            id="tab-pokedex"
            type="button"
            role="tab"
            aria-controls="panel-pokedex"
            aria-selected="false"
            tabindex="-1"
            data-vista="pokedex"
          >
            Pokédex completa
          </button>
        </nav>

        <section
          class="pokedex-section"
          id="panel-pokedex"
          role="tabpanel"
          aria-labelledby="tab-regiones"
          tabindex="0"
        >
          <nav
            class="colecciones"
            id="filtrosColeccion"
            aria-label="Elegir región o colección"
          >
            <div class="coleccion-grupo" id="grupoRegiones">
              <h2>Regiones</h2>
              <div
                class="coleccion-opciones"
                id="coleccionRegiones"
                role="group"
                aria-label="Colecciones por región"
              ></div>
            </div>
            <div class="coleccion-grupo" id="grupoTematicas" hidden>
              <h2>Temáticas</h2>
              <div
                class="coleccion-opciones"
                id="coleccionTematicas"
                role="group"
                aria-label="Colecciones temáticas"
              ></div>
            </div>
          </nav>
          <div id="coleccionDetalle" class="coleccion-detalle" hidden>
            <button
              id="volverColecciones"
              class="coleccion-volver"
              type="button"
            >
              <span aria-hidden="true">←</span>
              <span>Volver a regiones</span>
            </button>
          </div>
          <div class="coleccion-resumen" aria-live="polite" hidden>
            <div>
              <h1 id="coleccionTitulo">Pokédex completa</h1>
              <p id="coleccionDescripcion">Elige una región o temática.</p>
            </div>
            <span id="coleccionCantidad">1.025 Pokémon</span>
          </div>
          <div
            id="pokemonGrid"
            class="pokemon-grid"
            aria-live="polite"
            hidden
          ></div>
          <p id="errorHome" class="home-error" role="alert" hidden></p>
          <div
            id="cargaInfinita"
            class="carga-infinita"
            role="status"
            aria-live="polite"
            hidden
          ></div>
        </section>
      </main>
      <footer class="home-footer">
        Proyecto de fans sin afiliación oficial con Pokémon o Nintendo. Datos y
        sprites congelados de PokéAPI (funciona sin conexión).
      </footer>
    </div>
    <script src="js/offline.js" defer></script>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
