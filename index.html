<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174733" />
    <title>Pokémon Paint - Pokédex para colorear</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="home-view">
        <header class="home-header">
          <div class="home-marca">
            <span class="marca-icono" aria-hidden="true"
              ><i></i><i></i><i></i
            ></span>
            <span>Pokémon Paint</span>
          </div>
        </header>

        <section class="pokedex-section" aria-label="Pokémon disponibles">
          <div id="pokemonGrid" class="pokemon-grid" aria-live="polite"></div>
          <p id="errorHome" class="home-error" role="alert" hidden></p>
          <div
            id="cargaInfinita"
            class="carga-infinita"
            role="status"
            aria-live="polite"
          ></div>
        </section>
      </main>
    </div>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
