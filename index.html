<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Paint - Colorear por Números</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="cabecera">
      <h1>Pokémon Paint</h1>
      <p>Colorea el sprite por números</p>
    </header>

    <section class="controles">
      <div class="pokeapi">
        <button type="button" id="btnAleatorio">Aleatorio</button>
        <label>
          Nº Pokédex
          <input type="number" id="inputNumero" min="1" max="1025" value="25" />
        </label>
        <button type="button" id="btnPorNumero">Cargar</button>
      </div>
      <p id="infoPokemon" class="info-pokemon"></p>
      <p id="errorPokemon" class="error" hidden></p>
    </section>

    <div id="paleta" class="paleta"></div>

    <div class="tablero-contenedor">
      <canvas id="lienzoJuego"></canvas>
    </div>

    <div id="mensaje-victoria" class="victoria" hidden>
      ¡Completado! ¡Buen trabajo!
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
