<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#252941" />
    <meta
      name="description"
      content="Colorea Pokémon píxel a píxel con PintaDex."
    />
    <title>Colorear Pokémon | PintaDex</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="icons/icon-192.png"
      sizes="192x192"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="game-view">
        <header class="barra-superior">
          <div class="marca">
            <a
              id="btnVolverHome"
              class="btn-volver"
              href="index.html"
              aria-label="Volver a la Pokédex"
              title="Volver a la Pokédex"
              >←</a
            >
            <img class="marca-icono" src="favicon.svg" alt="" />
            <div class="marca-texto">
              <h1>PintaDex</h1>
              <p id="infoPokemon" class="info-pokemon"></p>
              <div class="progreso-general">
                <progress
                  id="progresoBarra"
                  max="1"
                  value="0"
                  aria-label="Progreso de coloreado"
                ></progress>
                <span id="progresoTexto">0 / 0</span>
              </div>
            </div>
          </div>

          <section class="controles" aria-label="Estado de carga">
            <p id="errorPokemon" class="error" hidden></p>
          </section>

          <div class="toolbar-acciones">
            <div class="historial-controles" aria-label="Historial de pintura">
              <button
                type="button"
                id="btnDeshacer"
                aria-label="Deshacer"
                title="Deshacer (Ctrl+Z)"
                disabled
              >
                ↶
              </button>
              <button
                type="button"
                id="btnRehacer"
                aria-label="Rehacer"
                title="Rehacer (Ctrl+Y)"
                disabled
              >
                ↷
              </button>
            </div>
            <div class="zoom" aria-label="Controles de zoom">
              <button
                type="button"
                id="btnZoomMenos"
                aria-label="Alejar"
                title="Alejar"
              >
                −
              </button>
              <span id="zoomNivel">100%</span>
              <button
                type="button"
                id="btnZoomMas"
                aria-label="Acercar"
                title="Acercar"
              >
                +
              </button>
              <button type="button" id="btnZoomAjustar">Ajustar</button>
            </div>
            <button
              type="button"
              id="btnReiniciar"
              aria-label="Reiniciar progreso"
              title="Reiniciar progreso"
              disabled
            >
              ↻
            </button>
          </div>
        </header>

        <main class="tablero-contenedor" aria-label="Lienzo para colorear">
          <div class="tablero-superficie">
            <canvas
              id="lienzoJuego"
              role="application"
              tabindex="0"
              aria-label="Imagen Pokémon para colorear"
              aria-describedby="ayudaTeclado"
            ></canvas>
          </div>
        </main>

        <div
          id="efectoVictoria"
          class="efecto-victoria"
          aria-hidden="true"
        ></div>
        <section class="paleta-dock" aria-label="Paleta de colores">
          <div class="paleta-acciones">
            <button type="button" id="btnCompletarColor" disabled>
              Rellenar color
            </button>
            <div class="acciones-progreso">
              <button
                type="button"
                id="btnExportarDibujo"
                aria-label="Descargar dibujo terminado en PNG"
                title="Descargar dibujo terminado en PNG"
                disabled
              >
                PNG
              </button>
              <button
                type="button"
                id="btnCompartirDibujo"
                aria-label="Compartir dibujo terminado"
                title="Compartir dibujo terminado"
                hidden
                disabled
              >
                Compartir
              </button>
              <button
                type="button"
                id="btnExportarProgreso"
                aria-label="Exportar progreso"
                title="Exportar progreso"
              >
                ↓ Progreso
              </button>
              <button
                type="button"
                id="btnImportarProgreso"
                aria-label="Importar progreso"
                title="Importar progreso"
              >
                ↑ Progreso
              </button>
              <input
                id="archivoProgreso"
                type="file"
                accept="application/json,.json"
                hidden
              />
            </div>
          </div>
          <div id="paleta" class="paleta"></div>
          <div id="mensaje-victoria" class="victoria" hidden>¡Completado!</div>
        </section>
        <p id="ayudaTeclado" class="visually-hidden">
          Usa las flechas para moverte por las casillas. Pulsa Intro o espacio
          para colorear. Pulsa del 1 al 9 para seleccionar un color.
        </p>
        <p id="anuncioTablero" class="visually-hidden" aria-live="polite"></p>
        <div
          id="avisoJuego"
          class="aviso-juego"
          role="status"
          aria-live="polite"
          hidden
        ></div>
      </section>
    </div>
    <script src="js/offline.js" defer></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
