<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#252941" />
    <meta
      name="description"
      content="Colorea Pokémon píxel a píxel con PintaDex."
    />
    <title>Colorear Pokémon | PintaDex</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="game-view">
        <header class="barra-superior">
          <div class="marca">
            <a
              id="btnVolverHome"
              class="btn-volver"
              href="index.html"
              aria-label="Volver a la Pokédex"
              title="Volver a la Pokédex"
              >←</a
            >
            <img class="marca-icono" src="favicon.svg" alt="" />
            <div class="marca-texto">
              <h1>PintaDex</h1>
              <p id="infoPokemon" class="info-pokemon"></p>
              <div class="progreso-general">
                <progress
                  id="progresoBarra"
                  max="1"
                  value="0"
                  aria-label="Progreso de coloreado"
                ></progress>
                <span id="progresoTexto">0 / 0</span>
              </div>
            </div>
          </div>

          <section class="controles" aria-label="Estado de carga">
            <p id="errorPokemon" class="error" hidden></p>
          </section>

          <div class="toolbar-acciones">
            <div class="historial-controles" aria-label="Historial de pintura">
              <button
                type="button"
                id="btnDeshacer"
                aria-label="Deshacer"
                title="Deshacer (Ctrl+Z)"
                disabled
              >
                ↶
              </button>
              <button
                type="button"
                id="btnRehacer"
                aria-label="Rehacer"
                title="Rehacer (Ctrl+Y)"
                disabled
              >
                ↷
              </button>
            </div>
            <div class="zoom" aria-label="Controles de zoom">
              <button
                type="button"
                id="btnZoomMenos"
                aria-label="Alejar"
                title="Alejar"
              >
                −
              </button>
              <span id="zoomNivel">100%</span>
              <button
                type="button"
                id="btnZoomMas"
                aria-label="Acercar"
                title="Acercar"
              >
                +
              </button>
              <button type="button" id="btnZoomAjustar">Ajustar</button>
            </div>
            <button
              type="button"
              id="btnReiniciar"
              aria-label="Reiniciar progreso"
              title="Reiniciar progreso"
              disabled
            >
              ↻
            </button>
          </div>
        </header>

        <main class="tablero-contenedor" aria-label="Lienzo para colorear">
          <div class="tablero-superficie">
            <canvas
              id="lienzoJuego"
              aria-label="Imagen Pokémon para colorear"
            ></canvas>
          </div>
        </main>

        <div
          id="efectoVictoria"
          class="efecto-victoria"
          aria-hidden="true"
        ></div>
        <section class="paleta-dock" aria-label="Paleta de colores">
          <div id="paleta" class="paleta"></div>
          <div id="mensaje-victoria" class="victoria" hidden>¡Completado!</div>
        </section>
        <div
          id="avisoJuego"
          class="aviso-juego"
          role="status"
          aria-live="polite"
          hidden
        ></div>
      </section>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
